<!DOCTYPE html>
<!-- LXR-LOADING | LXR UI Kit | © 2026 iBoss21 / LXRCore | lxrcore.com -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Land of Wolves</title>
  <link rel="stylesheet" href="lxr-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lxr">
  <div id="app" class="ld">
    <div class="ld-ember ld-ember--a"></div>
    <div class="ld-ember ld-ember--b"></div>
    <div class="ld-grain"></div>
    <img class="ld-wolf" src="img/wolf.png" alt="">

    <header class="ld-top">
      <img class="ld-logo" src="img/lxrcore-logo.png" alt="">
      <span class="lxr-mono lxr-t-ash" id="kicker"></span>
      <span class="lxr-grow"></span>
      <span class="lxr-mono lxr-t-smoke" id="version"></span>
    </header>

    <main class="ld-body">
      <h1 class="lxr-cut ld-title" id="title"></h1>
      <p class="ld-tagline" id="tagline"></p>
      <p class="ld-line" id="line"></p>
    </main>

    <footer class="ld-foot">
      <div class="ld-row lxr-mono">
        <span id="phase" class="lxr-t-ash"></span>
        <span class="lxr-grow"></span>
        <span id="percent" class="lxr-num lxr-t-bone">0%</span>
      </div>
      <div class="lxr-meter ld-meter"><div class="lxr-meter-fill" id="fill" style="width:0%"></div></div>
      <div class="ld-row lxr-mono lxr-t-smoke">
        <span id="hint"></span>
        <span class="lxr-grow"></span>
        <span id="discord"></span>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
